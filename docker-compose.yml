
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberguardian-backend
    env_file: .env            # DATABASE_URL and the API keys come from your real .env
    environment:
      APP_ENV: production
      TRUST_PROXY_HEADERS: "true"   # safe here: only nginx can reach the backend
    expose:
      - "8000"                # internal only, nothing is published to your machine or the internet
    restart: unless-stopped
    networks:
      - cyberguardian-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1   # same-origin: nginx forwards /api/ to the backend
    container_name: cyberguardian-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cyberguardian-net

networks:
  cyberguardian-net:
    driver: bridge