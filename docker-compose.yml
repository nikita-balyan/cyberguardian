
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberguardian-backend
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY}
    volumes:
      - ./cyberguardian.db:/app/cyberguardian.db
    restart: unless-stopped
    networks:
      - cyberguardian-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cyberguardian-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cyberguardian-net

networks:
  cyberguardian-net:
    driver: bridge
